model_list:
  - model_name: mistral-small-2503
    litellm_params:
      model: openai/mistral-small-2503
      api_base: os.environ/LLM_GATEWAY_BASE_URL
      api_key: os.environ/LLM_GATEWAY_API_KEY

  - model_name: qwen3.5-local
    litellm_params:
      model: qwen-toolcalling/qwen3.5:9b
      api_base: os.environ/OLLAMA_HOST

  - model_name: claude-haiku-4-5
    litellm_params:
      model: openai/claude-haiku-4-5
      api_base: os.environ/LLM_GATEWAY_BASE_URL
      api_key: os.environ/LLM_GATEWAY_API_KEY

  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: openai/gemini-3.1-flash-lite
      api_base: os.environ/LLM_GATEWAY_BASE_URL
      api_key: os.environ/LLM_GATEWAY_API_KEY

  - model_name: gemini-2.5-pro
    litellm_params:
      model: openai/gemini-2.5-pro
      api_base: os.environ/LLM_GATEWAY_BASE_URL
      api_key: os.environ/LLM_GATEWAY_API_KEY

router_settings:
  num_retries: 1
  retry_after: 0
  cache: true
  cache_ttl: 86400


litellm_settings:
  callbacks: app.router.smart_router.router_instance
  drop_params: true
  modify_params: true
  request_timeout: 120
  ssl_verify: false


general_settings:
  master_key: sk-litellm-local
  port: 4000