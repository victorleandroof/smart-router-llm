[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "smart-router-llm"
dynamic = ["version"]
description = "Proxy inteligente entre APIs compatíveis com OpenAI e múltiplos provedores de LLM, com roteamento por complexidade e compressão de contexto."
readme = "readme.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Mantido em sync manual com requirements.txt (usado pelo Dockerfile) —
# mesmo padrão de duplicação já aceito no projeto para config.yaml/MODEL_TIERS
